<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Indigo Flow Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar"> <!-- sama kayak index --> 
    <div class="container nav-wrap">
      <a href="index.html" class="logo">INDIGO<span>FLOW</span></a>
      <nav class="nav-links">
        <a href="shop.html" class="active">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
      </nav>
      <div class="nav-actions">
        <button id="darkToggle">🌙</button>
        <a href="cart.html" class="icon-btn">🛒 <span id="cartCount">0</span></a>
        <a href="#" class="icon-btn">❤️ <span id="wishCount">0</span></a>
        <button class="hamburger">☰</button>
      </div>
    </div>
  </header>

  <section class="container section">
    <div class="shop-toolbar">
      <input type="text" id="searchInput" placeholder="Cari produk...">
      <select id="categoryFilter">
        <option value="">Semua Kategori</option>
      </select>
      <select id="sortFilter">
        <option value="new">Terbaru</option>
        <option value="low">Harga: Rendah</option>
        <option value="high">Harga: Tinggi</option>
      </select>
    </div>
    <div class="product-grid" id="productGrid"></div>
  </section>

  <footer class="footer"> <!-- sama kayak index --> </footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
