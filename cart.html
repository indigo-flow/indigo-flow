<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Indigo Flow Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar"> <!-- sama --> </header>

  <section class="container section">
    <h2 class="section-title">Keranjang</h2>
    <div class="cart-wrap">
      <div id="cartItems"></div>
      <div class="cart-summary">
        <input type="text" id="couponCode" placeholder="Kode Kupon: INDIGO10">
        <button id="applyCoupon" class="btn btn-outline">Apply</button>
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">Rp0</span></div>
        <div class="summary-row"><span>Diskon</span><span id="discount">-Rp0</span></div>
        <div class="summary-row total"><span>Total</span><span id="total">Rp0</span></div>
        <a href="checkout.html" class="btn btn-primary full">Checkout</a>
      </div>
    </div>
  </section>

  <footer class="footer"> <!-- sama --> </footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
